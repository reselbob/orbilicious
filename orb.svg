<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sphere" cx="38%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#e2c4ff"/>
      <stop offset="30%"  stop-color="#9333ea"/>
      <stop offset="75%"  stop-color="#4c0a8a"/>
      <stop offset="100%" stop-color="#160026"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#9333ea" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient outer glow -->
  <circle cx="50" cy="50" r="49" fill="url(#ambient)"/>

  <!-- Orb sphere -->
  <circle cx="50" cy="50" r="38" fill="url(#sphere)"/>

  <!-- Inner mystical swirl glow -->
  <circle cx="50" cy="50" r="38" fill="url(#innerGlow)"/>

  <!-- Primary specular highlight (glass sheen) -->
  <ellipse cx="37" cy="34" rx="12" ry="7"
           fill="white" opacity="0.30"
           transform="rotate(-28 37 34)"/>

  <!-- Bright specular dot -->
  <circle cx="41" cy="28" r="4.5" fill="white" opacity="0.55"/>

  <!-- Tiny secondary highlight -->
  <circle cx="33" cy="35" r="2" fill="white" opacity="0.20"/>

  <!-- Six-point star inside the orb -->
  <g transform="translate(50,54) scale(0.82)" opacity="0.72">
    <polygon points="0,-11 2.5,-4.5 9.5,-4.5 4,0 6,7 0,3 -6,7 -4,0 -9.5,-4.5 -2.5,-4.5"
             fill="#f3e8ff"/>
  </g>

  <!-- Faint equatorial ring to suggest depth -->
  <ellipse cx="50" cy="50" rx="38" ry="9"
           fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.18"/>

  <!-- Pedestal base shadow -->
  <ellipse cx="50" cy="91" rx="17" ry="4.5" fill="#160026" opacity="0.45"/>

  <!-- Pedestal stem -->
  <rect x="44" y="86" width="12" height="7" rx="3"
        fill="#2e0a50" opacity="0.75"/>

  <!-- Pedestal dish -->
  <ellipse cx="50" cy="86" rx="14" ry="3.5" fill="#4c0a8a" opacity="0.70"/>
</svg>
